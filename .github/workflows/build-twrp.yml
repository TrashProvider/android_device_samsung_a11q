name: Build TWRP

on:
  workflow_dispatch:
    inputs:
      use_ccache:
        description: 'Enable CCache'
        required: true
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device-tree

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 libncurses5 lib32ncurses-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip \
            fontconfig python3 bc ccache libssl-dev
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo

      - name: Configure CCache
        if: inputs.use_ccache == true
        uses: actions/cache@v4
        with:
          path: .ccache
          key: twrp-ccache-${{ github.sha }}
          restore-keys: |
            twrp-ccache-

      - name: Sync TWRP source
        run: |
          export PATH=~/bin:$PATH
          git config --global user.name "nleloc"
          git config --global user.email "141159425+nleloc@users.noreply.github.com"
          mkdir twrp && cd twrp
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          repo sync -c --no-tags --no-clone-bundle -j$(nproc) --optimized-fetch --prune

      - name: Add device tree
        run: |
          mkdir -p twrp/device/samsung
          cp -r device-tree twrp/device/samsung/a11q
          rm -rf twrp/device/samsung/a11q/.git

      - name: Build
        run: |
          cd twrp
          export LC_ALL=C
          export ALLOW_MISSING_DEPENDENCIES=true

          if [ "${{ inputs.use_ccache }}" == "true" ]; then
            export USE_CCACHE=1
            export CCACHE_DIR=$GITHUB_WORKSPACE/.ccache
            export CCACHE_EXEC=/usr/bin/ccache
            ccache -M 10G
            ccache -z
          fi

          source build/envsetup.sh
          lunch twrp_a11q-eng
          mka recoveryimage -j$(nproc)

          if [ "${{ inputs.use_ccache }}" == "true" ]; then
            ccache -s
          fi

      - name: Upload recovery.img
        uses: actions/upload-artifact@v4
        with:
          name: twrp-a11q
          path: twrp/out/target/product/a11q/recovery.img

